version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: sk_jobpilot_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sk_jobpilot_api
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/sk_job_pilot
      - PORT=5000
    depends_on:
      - mongodb

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: sk_jobpilot_web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mongodb_data:
