<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SK JobPilot Assistant</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #090d16;
      color: #f1f5f9;
      margin: 0;
      padding: 16px;
    }
    h2 {
      font-size: 14px;
      margin-top: 0;
      color: #818cf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      background-color: #4f46e5;
      color: #ffffff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    input { width: 100%; box-sizing: border-box; background: #020617; color: #f1f5f9; border: 1px solid #334155; border-radius: 5px; padding: 8px; margin-bottom: 7px; }
    button:hover {
      background-color: #4338ca;
    }
    .field-list {
      max-height: 180px;
      overflow-y: auto;
      font-size: 11px;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 8px;
      background-color: #020617;
      margin-bottom: 12px;
    }
    .field-item {
      padding: 4px 0;
      border-bottom: 1px solid #0f172a;
      display: flex;
      justify-content: space-between;
    }
    .badge {
      font-size: 9px;
      padding: 2px 4px;
      border-radius: 4px;
      background: #1e1b4b;
      color: #a5b4fc;
    }
    .warn-badge {
      background: #451a03;
      color: #fcd34d;
    }
  </style>
</head>
<body>
  <h2>SK JobPilot Form Assistant</h2>
  <div class="status" id="status">Ready to detect job application fields...</div>

  <button id="captureBtn">Capture Current Job</button>
  <div id="captureForm" style="display:none;">
    <input id="jobTitle" placeholder="Job title" maxlength="300">
    <input id="jobCompany" placeholder="Company" maxlength="300">
    <input id="jobLocation" placeholder="Location (optional)" maxlength="300">
    <button id="saveJobBtn">Save Confirmed Job</button>
  </div>
  <button id="detectBtn">Detect Application Form Fields</button>

  <div class="field-list" id="fieldList" style="display: none;">
    <!-- Populated dynamically -->
  </div>

  <button id="fillBtn" style="display: none; background-color: #059669;">Autofill Safe Profile Values</button>

  <script src="popup.js"></script>
</body>
</html>
